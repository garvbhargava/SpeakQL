<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakQL - Choose workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
.ws{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
    text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px;
    transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.ws:hover{border-color:var(--accent);background:var(--accent-soft)}
.ws-name{font-weight:500}
.ws-meta{font-size:var(--t-small);color:var(--text-muted)}
.ws[disabled]{opacity:.55;cursor:not-allowed}
.ws[disabled]:hover{border-color:var(--border);background:var(--surface)}
.ws-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.domain-note{font-size:var(--t-small);color:var(--text-faint);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 15V9M8 18V6M12 20V4M16 18V6M20 15V9"/></symbol>
</svg>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:440px">
    <div class="brand" style="margin-bottom:var(--s5)">
      <div class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></div>
      <div class="brand-name">SpeakQL</div>
    </div>

    <h1 class="t-h1" style="font-size:19px;margin-bottom:6px">Choose a workspace</h1>
    <p class="muted t-small" style="margin-bottom:var(--s4)">Signed in as garv@northwind.com.</p>

    <div class="ws-list">
      <button class="ws">
        <span><span class="ws-name">Northwind Sales DW</span><br><span class="ws-meta">18 tables &middot; admin</span></span>
        <span class="tag">Open</span>
      </button>
      <button class="ws">
        <span><span class="ws-name">Support Analytics</span><br><span class="ws-meta">6 tables &middot; viewer</span></span>
        <span class="tag">Open</span>
      </button>
      <button class="ws" disabled>
        <span><span class="ws-name">Finance DW</span><br><span class="ws-meta">11 tables &middot; access pending</span></span>
        <span class="tag tag-wait">Awaiting approval</span>
      </button>
    </div>

    <p class="domain-note">Domain matched &mdash; northwind.com &middot; Northwind Trading</p>
    <button class="back">Sign out</button>
  </div>
</div>
</body>
</html>
