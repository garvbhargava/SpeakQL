<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakQL - Answer kinds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
.empty{padding:56px 0 24px;text-align:center;max-width:560px;margin:0 auto}
.empty h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.empty p{color:var(--text-muted);margin:0 0 22px}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.starter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:8px 15px;font-size:var(--t-small);color:var(--text-muted);
  transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.starter:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<script src="js/mock.js" defer></script>
<script src="js/ui.js" defer></script>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 15V9M8 18V6M12 20V4M16 18V6M20 15V9"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-8 8H4l2-3.2A8 8 0 1121 12z"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.6 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H2a2 2 0 110-4h.1A1.6 1.6 0 005 6.6l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H10a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V10a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M11 3H6a2 2 0 00-2 2v14a2 2 0 002 2h5"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.9 18a2 2 0 001.7 3h16.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.2 12l2 2 3.6-3.8"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 114 2c-.9.7-1.5 1.2-1.5 2.3M12 17h.01"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a5 5 0 015 5c0 3.5-5 10-5 10s-5-6.5-5-10a5 5 0 015-5z"/><circle cx="12" cy="7" r="2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<div class="shell">
  <header class="topbar">
    <div class="topbar-l">
      <button class="menu-btn"><svg class="i i-lg"><use href="#i-menu"/></svg></button>
      <div class="brand"><div class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></div><div class="brand-name">SpeakQL</div></div>
      <span class="slash">/</span>
      <button class="ws-switch"><span class="nm">Northwind Sales DW</span><svg class="i i-sm"><use href="#i-chevron-down"/></svg></button>
    </div>
    <div class="topbar-r">
      <div class="seg" data-role="mode">
        <button aria-pressed="true" data-mode="simple">Simple</button>
        <button aria-pressed="false" data-mode="analyst">Analyst</button>
      </div>
      <div class="avatar">GB</div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div>
        <button class="new-thread"><svg class="i"><use href="#i-plus"/></svg> New thread</button>
        <p class="side-h">Threads</p>
        <p class="t-small faint" style="padding:0 var(--s2)">No threads yet.</p>
      </div>
      <div class="schema">
        <p class="side-h">Schema &middot; 18 tables</p>
        <ul>
          <li><span class="nm">orders</span></li>
          <li><span class="nm">customers</span></li>
          <li><span class="nm">regions</span></li>
          <li><span class="nm">products</span></li>
          <li><span class="nm">order_items</span></li>
          <li><span class="nm">invoices</span></li>
          <li><span class="nm">payments</span></li>
          <li><span class="nm">returns</span></li>
        </ul>
        <p class="schema-note">Retrieved tables highlight as you ask.</p>
      </div>
      <div class="side-foot">
        <button class="side-link on"><svg class="i"><use href="#i-msg"/></svg><span class="lbl">Ask</span></button>
        <button class="side-link"><svg class="i"><use href="#i-table"/></svg><span class="lbl">Dashboard</span></button>
        <button class="side-link"><svg class="i"><use href="#i-settings"/></svg><span class="lbl">Admin</span><span class="badge-count">3</span></button>
        <button class="side-link"><svg class="i"><use href="#i-logout"/></svg><span class="lbl">Sign out</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="scroll" id="scroll">
        <div class="stream" id="stream"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea class="ask" id="ask" rows="1" placeholder="Ask anything about your data"></textarea>
          <button class="send" id="send"><svg class="i i-lg"><use href="#i-send"/></svg></button>
        </div>
        <div class="composer-foot">
          <span>Read-only. Every query is validated before it runs.</span>
          <span class="analyst-only hide">Local model handles 72% of questions</span>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const KIND_ORDER = ["metric", "ranking", "trend", "composition", "driver"];
  window.addEventListener("load", async () => {
    initModeToggle();
    document.querySelector("button[data-mode='analyst']").click();
    const stream = document.getElementById("stream");
    for (const k of KIND_ORDER) {
      await askAndRender(MOCK_ANSWERS[k].question, stream);
    }
    document.getElementById("send").onclick = () => {
      const v = document.getElementById("ask").value.trim();
      if (!v) return;
      document.getElementById("ask").value = "";
      askAndRender(v, stream);
    };
  });
</script>
</body>
</html>
