<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakQL - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 15V9M8 18V6M12 20V4M16 18V6M20 15V9"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.9 18a2 2 0 001.7 3h16.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-google" viewBox="0 0 24 24"><path d="M21.6 12.2c0-.7-.06-1.35-.18-2H12v3.9h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" fill="#4285F4" stroke="none"/><path d="M12 22c2.7 0 4.96-.9 6.6-2.4l-3.2-2.5c-.9.6-2 .95-3.4.95-2.6 0-4.8-1.75-5.6-4.1H3.1v2.6A10 10 0 0012 22z" fill="#34A853" stroke="none"/><path d="M6.4 13.95a6 6 0 010-3.85V7.5H3.1a10 10 0 000 9l3.3-2.55z" fill="#FBBC05" stroke="none"/><path d="M12 5.95c1.47 0 2.8.5 3.83 1.5l2.85-2.85C16.95 2.98 14.7 2 12 2A10 10 0 003.1 7.5l3.3 2.6C7.2 7.7 9.4 5.95 12 5.95z" fill="#EA4335" stroke="none"/></symbol>
</svg>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:var(--s5)">
      <div class="brand-mark"><svg class="i"><use href="#i-logo"/></svg></div>
      <div class="brand-name">SpeakQL</div>
    </div>

    <h1 class="t-h1" style="font-size:19px;margin-bottom:6px">Sign in to your workspace</h1>
    <p class="muted t-small" style="margin-bottom:var(--s5)">Use your work email. We match the domain to your company's connected databases.</p>

    <label class="field">
      <span class="field-label">Work email</span>
      <input class="input" type="email" id="email" placeholder="name@company.com" autocomplete="email">
    </label>
    <p class="err show" id="email-err">Use your work email. Personal domains can't be matched to a company workspace.</p>

    <button class="btn btn-block">Continue</button>
    <div class="divider">or</div>
    <button class="btn btn-ghost btn-block" style="display:flex;gap:10px">
      <svg class="i i-lg"><use href="#i-google"/></svg> Continue with Google
    </button>

    <p class="t-small faint" style="margin-top:var(--s5);text-align:center">
      Demo accounts: garv@northwind.com (admin) &middot; dhruv@acme.com
    </p>
  </div>
</div>
</body>
</html>
