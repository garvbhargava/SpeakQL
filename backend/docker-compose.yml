# SpeakQL backend stack (Backend Plan §4).
#
# The fourth service, `web`, lives on the Full-Stack branch -- this branch is
# the backend alone.
#
#   make up          db + api, with Gemma hosted
#   make up-local    db + api + llm, with Gemma in a container
#   make bootstrap   one-off: databases, roles, warehouses, demo seed
#
# `llm` sits behind a Compose profile so one file serves both hosting choices.
# llm_client.py presents the same interface either way, which is the whole
# reason that module exists.
#
# The owner's credentials reach exactly one container: the one-off `bootstrap`
# service. The long-running `api` is never given them -- and config.py refuses
# to start if any of its DSNs names a superuser.

name: speakql-backend

x-runtime-dsns: &runtime-dsns
  # Inside the network the host is `db`, whatever .env says for local runs.
  # META_DSN connects as speakql_app, a least-privilege role that owns the
  # metadata tables. It is NOT the owner: the first version of this file used
  # speakql_owner here, a superuser, which is precisely what the design
  # promises the API never holds.
  META_DSN:    postgresql+psycopg://speakql_app:${APP_PASSWORD:-app_dev}@db:5432/speakql_meta
  # For the three warehouse roles only the credentials are used: the database
  # name is swapped per connection by db/tenant_engine.py.
  RO_DSN:      postgresql+psycopg://speakql_ro:${RO_PASSWORD:-ro_dev}@db:5432/northwind_dw
  WRITE_DSN:   postgresql+psycopg://speakql_write:${WRITE_PASSWORD:-write_dev}@db:5432/northwind_dw
  EDITS_DSN:   postgresql+psycopg://speakql_edits_rw:${EDITS_PASSWORD:-edits_dev}@db:5432/northwind_dw
  UPLOADS_DSN: postgresql+psycopg://speakql_upload_ddl:${UPLOAD_PASSWORD:-upload_dev}@db:5432/speakql_uploads
  # Not ${LLM_ENDPOINT}: compose reads .env for interpolation too, and .env's
  # value is for running the API on the host (localhost) -- inside a container
  # localhost is the container itself, so Gemma was never found. Set
  # COMPOSE_LLM_ENDPOINT=http://host.docker.internal:11434 to use an Ollama
  # running on the host instead of the llm service.
  LLM_ENDPOINT: ${COMPOSE_LLM_ENDPOINT:-http://llm:11434}

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: speakql_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speakql_dev_owner}
      POSTGRES_DB: speakql_meta
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - speakql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakql_owner -d speakql_meta"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *runtime-dsns
      # Blanked explicitly, so a value in .env can never reach this container.
      SPEAKQL_OWNER_DSN: ""
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # The trained checkpoints, mounted rather than built in: retraining is
      # then a restart, not an image rebuild. Read-only -- the API loads
      # models and never writes one.
      - ./ml/checkpoints:/srv/ml/checkpoints:ro
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /srv
          ignore: [tests/, .venv/]
        - action: rebuild
          path: requirements.txt
    restart: unless-stopped

  # One-off. The only place the owner's credentials exist at runtime.
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["setup"]
    env_file:
      - .env
    environment:
      <<: *runtime-dsns
      SPEAKQL_OWNER_DSN: postgresql://speakql_owner:${POSTGRES_PASSWORD:-speakql_dev_owner}@db:5432/postgres
    command: ["bash", "scripts/bootstrap.sh"]
    depends_on:
      db:
        condition: service_healthy

  llm:
    image: ollama/ollama
    profiles: ["local-llm"]
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - speakql_ollama:/root/.ollama
    restart: unless-stopped

volumes:
  speakql_pgdata:
  speakql_ollama:
